<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Calculator</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="top">
        <span id="num1"></span>
        <span id="num2"></span>
    </div>
    <div class="hero">
        <button id="btn-1" onclick="add()">Add</button>
        <button id="btn-2" onclick="subtract()">Subtract</button>
        <button id="btn-3" onclick="divide()">Divide</button>
    </div>
    <div class="footer">
        <button id="btn-4" onclick="multiply()">Multiply</button>
        <p id="result"><span id="span-1">Result:</span> </p>
    </div>



    <script src="index.js"></script>
</body>

</html>
