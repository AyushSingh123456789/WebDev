<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="container">
        <h1 id="title-1"><span style="color: white">Generate a</span> <br> <span style="color: green">random
                password</span></h1>
        <h2 id="title-2">Never use an insecure password again.</h2>
        <button id="generate-pw" onclick="passwordCreate()">Generate passwords</button>
    </div>
    <hr>

    <div class="choices">
        <button id="pw-1"></button>
        <button id="pw-2"></button>
    </div>
    <div class="stretch-features">
        <input type="number" id="pw-len">
        <button id="pw-len-btn" onclick="passwordLength()">SET</button>
    </div>


    <script src="index.js"></script>
</body>

</html>
