<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Task and Priority Planner</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="container-1">
        <input id="title-1" type="text" placeholder="Title" style="text-align: center;">
        <input id="priority-1" type="text" placeholder="Priority(High, Low)" style="text-align: center;">
        <input id="due-date-1" type="date" placeholder="due-date" style="text-align: center;">
        <button id="add-btn-1">Add</button>
        <button id="view-all">View All</button>
        <button id="view-highP">View High Priority</button>
        <button id="view-lowP">View Low Priority</button>
        <button id="delete-all">Delete All</button>
    </div>
    <div class="local-storage-view"></div>


    <script src="index.js"></script>
</body>

</html>
