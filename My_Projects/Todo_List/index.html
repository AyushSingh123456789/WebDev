<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="first-div">
        <h1 id="title-1">TO DO LIST</h1>
    </div>

    <div class="second-div">
        <input type="text" id="task-name" placeholder="Add Task">
        <button id="add-btn">Add</button>
    </div>

    <div class="new-entry-1">
        <p id="priority-check">Priority:</p>
        <button id="priority-btn-1">High</button>
        <button id="priority-btn-2">Low</button>
    </div>

    <div class="new-entry-2">
        <p id="due-date-text">Due Date:</p>
        <input type="date" id="due-date">
        <button id="due-date-btn">SET</button>
    </div>

    <div class="new-entry-3">
        <button id="submit-btn">SUBMIT</button>
        <button id="clear-btn">CLEAR ALL</button>
    </div>

    <div class="third-div">
        <h2 id="title-2">Task List</h2>
    </div>

    <hr style="margin-top: 25px;">

    <!-- <div class="fourth-div">
        <p id="completed-uncompleted"></p>
    </div> -->

    <div id="result-area">

    </div>

    <script src="index.js"></script>
</body>

</html>
