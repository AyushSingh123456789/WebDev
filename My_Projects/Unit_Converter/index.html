<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="container-1">
        <h1 id="title-1">Metric/Imperial Unit Conversion</h1>
        <input id="input-field" type="number">
        <button id="convert-btn">Convert</button>
    </div>

    <div class="container-2">
        <div class="length-box">
            <h2 id="title-2">Length (Meter/Feet)</h2>
        </div>

        <div class="volume-box">
            <h2 id="title-3">Volume (Liters/Gallons)</h2>
        </div>

        <div class="mass-box">
            <h2 id="title-4">Mass (Kilograms/Pounds)</h2>
        </div>
    </div>


    <script src="index.js"></script>
</body>

</html>
