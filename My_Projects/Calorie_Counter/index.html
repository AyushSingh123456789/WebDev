<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie_Counter</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="container">
        <h1 id="title-1">Recommended Calories For Bulking/Cutting</h1>
    </div>
    <div class="field-1">
        <h2 id="input-1">Weight(in kg): </h2>
        <input id="input-1-value" type="number">
    </div>

    <div class="field-2">
        <h2 id="input-2">Height(in cm): </h2>
        <input id="input-2-value" type="number">
    </div>

    <div class="field-3">
        <h2 id="input-3">Age(in years): </h2>
        <input id="input-3-value" type="number">
    </div>

    <div class="latest-field2">
        <button id="male-btn">Male</button>
        <button id="female-btn">Female</button>
    </div>

    <div class="latest-field">
        <button id="exercise-quant-1">Sedentary(little or no exercise)</button>
        <button id="exercise-quant-2">Lightly Active(1-3 days/week)</button>
        <button id="exercise-quant-3">Moderately Active(3-5 days/week)</button>
        <button id="exercise-quant-4">Very Active(6-7 days/week)</button>
        <button id="exercise-quant-5">Super Active(very hard training/Job)</button>
    </div>

    <div class="field-4">
        <h2 id="input-4">Goal: </h2>
        <button id="bulk-btn">BULK</button>
        <button id="cut-btn">CUT</button>
    </div>

    <div class="result">

    </div>

    <script src="index.js"></script>
</body>

</html>
