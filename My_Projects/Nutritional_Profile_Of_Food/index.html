<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutritional Profile</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="container-1">
        <h1 id="title-1">Nutritional Food Tracker</h1>
    </div>

    <div class="container-2">
        <h2 id="food-item-name"></h2>
        <input type="text" id="name-input">
        <button id="name-submit">Submit</button>
    </div>

    <div class="container-3">
        <h2 id="food-item-qty"></h2>
        <input type="text" id="qty-input">
        <button id="qty-submit">Submit</button>
    </div>

    <div class="new-1">
        <button id="calculate-btn">Calculate</button>
    </div>

    <div class="container-4">
        <h2 id="food-item-cal"></h2>
        <h2 id="food-item-macros"></h2>
        <button id="whole-list-view">Stored Food List</button>
    </div>

    <div id="result-view-area"></div>

    <script src="index.js"></script>
</body>

</html>
